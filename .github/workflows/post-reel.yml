name: post-reel
on:
  schedule:
    - cron: "30 13 * * *"   # daily 13:30 UTC (7:00 PM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts requests
      - name: Make and post next part
        run: python autoreel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - name: Keep the finished video (download it if posting ever fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-video
          path: work/part*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Save story progress
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "update story state" || true
          git push
